name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bash:
    name: Bash Syntax-check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Bash syntax-check
        run: |
          bash -n bin/fz

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          format: gcc

  bats:
    name: BATS Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update APT package index
        run: |
          sudo apt-get update

      - name: Install BATS and other dependencies
        run: |
          sudo apt-get install --no-install-recommends -y bats bsdextrautils fzf git tmux zsh

      - name: Install man-db and restore manpages
        run: |
          sudo apt-get install --no-install-recommends -y man-db
          sudo apt-get download man-db
          sudo dpkg-deb -x man-db_*.deb /

      - name: Run BATS tests
        run: |
          bats --verbose-run tests/
